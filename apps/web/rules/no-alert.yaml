version: 2
id: no-alert
message: alert 대신 사용자 인터페이스에서 메시지를 표시하세요
match:
  kind: CallExpression
  any:
    - properties: {callee.type: Identifier, callee.name: alert}
    - properties:
        callee.type: MemberExpression
        callee.computed: false
        callee.object.type: Identifier
        callee.object.name: window
        callee.property.name: alert
