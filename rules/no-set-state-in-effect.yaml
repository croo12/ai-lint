version: 2
id: no-set-state-in-effect
message: useEffect에 setState를 넣어서는 안됩니다
match:
  kind: CallExpression
where:
  all:
    - any:
        - properties: {callee.type: Identifier, callee.name: useEffect}
        - properties:
            callee.type: MemberExpression
            callee.computed: false
            callee.object.type: Identifier
            callee.object.name: React
            callee.property.name: useEffect
    - at:
        path: arguments.0
        match:
          kind: [ArrowFunctionExpression, FunctionExpression]
          descendant:
            match:
              kind: CallExpression
              capture: update
              any:
                - properties: {callee.type: Identifier, callee.name: setState}
                - ancestor:
                    match:
                      kind: Program
                      descendant:
                        match:
                          kind: VariableDeclarator
                          properties: {id.type: ArrayPattern, init.type: CallExpression}
                          same_binding: {left: id.elements.1, right: "$update.callee"}
                          any:
                            - properties: {init.callee.type: Identifier, init.callee.name: useState}
                            - properties:
                                init.callee.type: MemberExpression
                                init.callee.computed: false
                                init.callee.object.type: Identifier
                                init.callee.object.name: React
                                init.callee.property.name: useState
