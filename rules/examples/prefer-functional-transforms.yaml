version: 2
id: prefer-functional-transforms
message: 순수한 컬렉션 변환에는 명확한 함수형 표현을 사용하세요.
match:
  kind: [FunctionDeclaration, FunctionExpression, ArrowFunctionExpression]
where:
  at:
    path: body
    match:
      kind: BlockStatement
      all:
        - descendant:
            stop_at: &boundaries [FunctionDeclaration, FunctionExpression, ArrowFunctionExpression, ClassDeclaration, ClassExpression]
            match:
              kind: VariableDeclarator
              capture: array
              properties:
                id.type: Identifier
                init.type: ArrayExpression
                init.elements: []
        - descendant:
            stop_at: *boundaries
            match:
              kind: [ForStatement, ForOfStatement, ForInStatement, WhileStatement, DoWhileStatement]
              before: {left: "$array", right: "."}
              at:
                path: body
                match:
                  descendant:
                    stop_at: *boundaries
                    match:
                      kind: CallExpression
                      exists: [arguments.0]
                      properties:
                        optional: false
                        callee.type: MemberExpression
                        callee.computed: false
                        callee.optional: false
                        callee.property.name: push
                      same_binding: {left: callee.object, right: "$array.id"}
judge:
  context: matched_node
  criteria: |
    YAML의 AST 조건이 지역 빈 배열에 반복문으로 push하는 후보 함수를 선택했습니다.
    이 패턴만으로 순수한 함수나 리팩터링 가능성이 증명된 것은 아닙니다.

    입력 컬렉션을 변환하거나 선별하는 로직이고, map, filter, flatMap 등으로
    기존 동작을 유지하면서 더 명확하게 표현할 수 있으면 violation입니다.

    다음은 pass입니다.
    - 부수 효과의 순서, 조기 종료, 성능 요구 때문에 반복문이 적절합니다.
    - 함수형 표현이 복잡한 reduce나 과도한 중간 배열을 요구합니다.
    - 컬렉션 변환과 관계없는 로직입니다.

    지역 배열을 변경한다는 사실만으로 함수가 비순수하다고 판단하지 마세요.
    반환값, 오류 처리, 실행 순서 등 관찰 가능한 동작을 보존해야 합니다.
    유효하지 않은 항목을 제외하는 요구에는 filter가 적합하지만,
    기존의 전체 실패 처리를 임의로 부분 성공 처리로 바꾸지 마세요.
    판단에 필요한 문맥이 부족하면 unknown을 반환하세요.
