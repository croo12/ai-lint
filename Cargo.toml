[workspace]
members = ["apps/cli", "packages/analyzer", "packages/rule-contract", "packages/rule-engine", "packages/rules"]
default-members = ["apps/cli", "packages/analyzer", "packages/rule-contract", "packages/rule-engine", "packages/rules"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ai-lint-analyzer = { path = "packages/analyzer" }
ai-lint-rule-contract = { path = "packages/rule-contract" }
ai-lint-rule-engine = { path = "packages/rule-engine" }
ai-lint-rules = { path = "packages/rules" }
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
oxc_allocator = "=0.148.0"
oxc_ast = "=0.148.0"
oxc_parser = "=0.148.0"
oxc_span = "=0.148.0"
oxc_semantic = "=0.148.0"
